# Builds the module and publishes it as a GitHub Release whenever main carries a version that has no
# release yet. To release: bump "version" in module/module.json and merge to main. The release and its tag
# (v<version>) are created here; nothing has to push a tag. It can also be run by hand from the Actions tab.
#
# Each release carries two assets:
#   module.zip   - dist/bontari-homebrew with module.json at the zip root, which is what Foundry expects
#   module.json  - the manifest Foundry installs and updates from
# The shipped manifest's "download" is pinned to this release's zip, so an older manifest keeps fetching the
# zip it was built with. Every release is marked "latest", which is what the install URL follows:
#   https://github.com/aky9/bontari-homebrew/releases/latest/download/module.json
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Skip if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./module/module.json').version")"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version in module/module.json to release again"
            echo "RELEASED=1" >> "$GITHUB_ENV"
          fi

      - name: Install, parse, build, validate
        if: env.RELEASED != '1'
        run: ./setup.sh

      - name: Pin the manifest's download URL to this release
        if: env.RELEASED != '1'
        run: |
          node -e '
            const fs = require("fs");
            const p = "dist/bontari-homebrew/module.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + "\n");
            console.log("download:", m.download);
          '

      - name: Zip the module
        if: env.RELEASED != '1'
        run: cd dist/bontari-homebrew && zip -r ../../module.zip . && unzip -l ../../module.zip | head -20

      - name: Publish the release
        if: env.RELEASED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="module.zip dist/bontari-homebrew/module.json"
          gh release create "$TAG" $assets --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
